name: Java CI with Gradle

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Extract project version
      id: project
      run: echo "version=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

    - name: Show extracted project version
      run: echo "The found version ${{ steps.project.outputs.version }}"

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: jdbgen-${{ steps.project.outputs.version }}.zip
        path: build/distributions/*.zip
